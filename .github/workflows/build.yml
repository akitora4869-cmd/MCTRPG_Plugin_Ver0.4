name: Build TRPGCharacter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: TRPGCharacter-GitHub-WeaponDice/pom.xml

      - name: Build with Maven
        working-directory: TRPGCharacter-GitHub-WeaponDice
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TRPGCharacter-Paper-1.20.1
          path: TRPGCharacter-GitHub-WeaponDice/target/TRPGCharacter-1.0.0.jar
          if-no-files-found: error
