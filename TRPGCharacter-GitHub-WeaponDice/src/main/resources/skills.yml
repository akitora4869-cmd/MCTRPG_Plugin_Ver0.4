# CoC第6版向け技能設定
#
# 戦闘技能「こぶし」「刀剣」を追加しています。
# 武器ごとの技能対応は weapons.yml で設定できます。
#
# default は数字のほか、以下のような能力値式にも対応します。
#   "EDU*5"
#   "DEX*2"
#
# ID（spot_hidden等）は内部で使用するため、英数字と_を推奨します。

