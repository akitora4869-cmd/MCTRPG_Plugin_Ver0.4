    armor: true

  PILLAGER:
    name: "ピリジャーのクロスボウ"
    damage: "1d6"
    armor: true

  VINDICATOR:
    name: "ヴィンディケーターの斧"
    damage: "1d8"
    armor: true

  RAVAGER:
    name: "ラヴェジャーの突進"
    damage: "2d6"
    armor: true

  BLAZE:
    name: "ブレイズの火球"
    damage: "1d6"
    armor: true

  GHAST:
    name: "ガストの火球"
    damage: "2d6"
    armor: true

  WITHER_SKELETON:
    name: "ウィザースケルトンの攻撃"
    damage: "1d6"
    armor: true

  WARDEN:
    name: "ウォーデンの攻撃"
    damage: "3d6"
    armor: true

  PLAYER:
    name: "プレイヤーの攻撃"
    damage: "1d3"
    armor: true

environment:
  FALL:
    name: "落下"
    armor: false
    distance:
      - min: 4
        max: 6
        damage: "1d3"
      - min: 7
        max: 10
        damage: "1d6"
      - min: 11
        max: 15
        damage: "2d6"
      - min: 16
        max: 20
        damage: "3d6"
      - min: 21
        damage: "4d6"

  FIRE:
    name: "炎"
    damage: "1"
    armor: false
    cooldown-seconds: 3

  FIRE_TICK:
