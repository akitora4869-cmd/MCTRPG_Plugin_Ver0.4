# TRPG戦闘用武器設定
#
# 未登録のアイテムは従来のMinecraft攻撃処理を使用します。
# 登録した武器は 1d100技能判定 → ダメージダイス → DB → 装甲 の順で処理します。
#
# damage-bonus: true で STR+SIZ によるCoC6系DBを加算します。

enabled: true
allow-player-vs-player: true

result-rules:
  # クリティカル時は武器ダイスと正のDBを最大値として扱う
  critical-max-damage: true

  # スペシャル成功時の固定ボーナス
  special-flat-bonus: 1

fist:
  name: "こぶし"
  skill: "fist"
  damage: "1d3"
  damage-bonus: true

weapons:
  WOODEN_SWORD:
    name: "木の剣"
    skill: "sword"
    damage: "1d4"
    damage-bonus: true

  STONE_SWORD:
    name: "石の剣"
    skill: "sword"
    damage: "1d6"
    damage-bonus: true

  IRON_SWORD:
    name: "鉄の剣"
    skill: "sword"
    damage: "1d8+1"
    damage-bonus: true

  GOLDEN_SWORD:
    name: "金の剣"
    skill: "sword"
    damage: "1d8+1"
    damage-bonus: true

  DIAMOND_SWORD:
    name: "ダイヤモンドの剣"
    skill: "sword"
    damage: "1d8+1"
    damage-bonus: true

  NETHERITE_SWORD:
    name: "ネザライトの剣"
    skill: "sword"
    damage: "1d8+1"
    damage-bonus: true
